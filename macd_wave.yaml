# MACD Wave Strategy Configuration
# Separate from bull flag config — independent strategy

strategy:
  name: macd_wave
  enabled: true

# Universe filters (applied to daily bars to find candidates)
universe:
  min_price: 15.0           # Validated: $15-30 sweet spot
  max_price: 30.0           # Validated: >$30 kills WR, >$50 loses money
  min_daily_volume: 1000000 # Minimum day volume
  min_intraday_pct: 10.0

# Entry filters (applied at the +threshold% cross point)
entry:
  cross_time_max_min: 0     # 0 = disabled. Tight filters (3min) cut P&L $122K→$49K
  min_vol_at_cross: 0       # 0 = disabled
  max_vol_at_cross: 0       # 0 = disabled. 300K filter too aggressive
  min_macd_hist_pct: 0.0    # 0 = disabled. 0.5% filter cuts too many winners
  max_price_at_entry: 0     # 0 = disabled

# MACD indicator parameters
macd:
  fast_period: 12
  slow_period: 26
  signal_period: 9
  confirm_bars: 3           # Consecutive positive histogram bars before entry

# Wave management
waves:
  max_waves: 1              # Max waves to trade per stock per day
  w1_scout: false           # If true, W1 is paper-only, trade W2+ after qualified W1
  w1_min_pct: 5.0           # If w1_scout, minimum W1 gain % to qualify for W2+

# Position sizing
sizing:
  position_size: 50000      # $ per position
  max_concurrent: 5         # Max simultaneous open positions

# Slippage model
slippage:
  entry_pct: 0.001          # 0.1% added to entry price
  exit_pct: 0.001           # 0.1% subtracted from exit price

# Risk management
risk:
  hard_stop_pct: 0.02       # 2% hard stop loss per trade
  daily_loss_limit: -5000   # Stop trading after this $ daily loss (0 = disabled)
