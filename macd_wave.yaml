# MACD Wave Strategy Configuration
# Separate from bull flag config — independent strategy

strategy:
  name: macd_wave
  enabled: true

# Universe filters (applied to daily bars to find candidates)
universe:
  min_price: 5.0            # Original validated run included $5-15 stocks (FLYE $5.16, BTTC $13.65 = $60K P&L)
  max_price: 30.0           # Validated: >$30 kills WR, >$50 loses money
  min_daily_volume: 500000  # Previous-day volume floor (1M kills strategy, 500K is sweet spot: 47% WR, +$230K)
  min_dollar_volume: 3000000  # Min daily dollar volume — filters untradeable micro-caps
  min_intraday_pct: 10.0

# Entry filters (applied at the +threshold% cross point)
entry:
  cross_time_max_min: 10    # Max minutes after open for the +10% threshold
                            # to be HIT (gates wave onset, NOT entry time).
  # Entry time-of-day gate (added 2026-05-22). Reject any MACD-cross entry
  # whose decision time is > N minutes after 09:30 ET. cross_time_max_min
  # only bounds when +10% was first hit — entries could fire hours later.
  # Forensic of 110 live trades: entries <=09:45 ET = 31% WR / -$17K;
  # entries >09:45 ET = 11% WR / -$37K. 0 = disabled (legacy).
  last_entry_minutes_after_open: 15
  min_vol_at_cross: 0       # 0 = disabled
  max_vol_at_cross: 300000  # Validated: >300K = crowded
  min_macd_hist_pct: 0.5    # Validated: MACD hist >= 0.5% of price
  max_price_at_entry: 30    # Match universe max
  # Spread gate — skip entries when bid-ask spread is too wide.
  # Live data (36 trades, Apr 2026): <100bps → 41% WR, +$920/trade;
  # >=100bps → 5% WR, -$1,621/trade. Consistent across all 4 time periods.
  max_entry_spread_bps: 100   # Skip if (ask-bid)/price > 100bps. 0 = disabled.
  # Smart entry: L1-informed pricing + early entry on strong book
  smart_entry_enabled: true   # Smart PRICING enabled (ask + buffer, see below)
  # Post-2026-04-20 fix: limit = ask × (1 + buffer_bps/10000). Replaces the
  # older midpoint/bid+0.75*spread logic that went stale on fast movers (USGG
  # miss — see post-mortem). 30bps matches ORB + bull flag slip budget and
  # survives sub-second ask ticks during the ~1s quote→submit latency.
  # Raise to 50bps if fast-movers still miss; drop to 0 to re-test legacy pricing.
  smart_limit_ask_buffer_bps: 30
  early_entry_bars: 3         # DISABLED: set to confirm_bars (3) = no early entry until backtested
  early_bid_ask_ratio: 2.0    # bid_sz/ask_sz required for early entry
  early_max_spread_pct: 0.003 # max spread for early entry (0.3%)
  normal_bid_ask_ratio: 1.5   # for 2nd bar entry
  normal_max_spread_pct: 0.005 # for 2nd bar entry (0.5%)

# 2026-04-28: incident-driven entry filters (HTCO bought at 22% of day high
# after a 360% premarket pump retraced — circuit-breaker halt, lost $3,482).
# See research/study_macd_day_from_high.py for BT calibration.
filter:
  # Day-from-high floor: skip if entry_price / today's RTH high < threshold.
  # 0.0 = disabled. 0.70 = provably inert in 16-mo BT (min observed 0.727)
  # while catching the HTCO-class falling-knife archetype.
  day_from_high_min_pct: 0.70
  # Halt-aware: skip if news_cache flags a halt today (LULD / circuit
  # breaker / trading paused). Sub-ms SQLite read at entry path; bull flag's
  # NewsWorker pre-warms the cache as a side effect of normal classification.
  halt_aware: true

# MACD indicator parameters
macd:
  fast_period: 12
  slow_period: 26
  signal_period: 9
  confirm_bars: 3

# Wave management
waves:
  max_waves: 1              # Max waves to trade per stock per day
  w1_scout: false           # If true, W1 is paper-only, trade W2+ after qualified W1
  w1_min_pct: 5.0           # If w1_scout, minimum W1 gain % to qualify for W2+

# Position sizing
sizing:
  position_size: 50000      # $ per position
  max_concurrent: 5         # Max simultaneous open positions
  max_adv_participation_pct: 0  # Disabled — waiting for real L2 depth data
  # V4 conviction sizing — multiplies shares by conv_mult at entry time.
  # OOS-validated: +$54K / +49.5% total P&L on 15mo BT, +$24.6K mean lift
  # across 3 walk-forward splits (worst split +$10.3K — robust).
  # Applied as a sizing multiplier only; filter approach fails OOS.
  conviction_sizing:
    enabled: true                     # Off disables scaling; on ships V4 (score 1.0-1.8).
    max_position_size_usd: 90000      # Hard cap even if conv_mult * position > this.
                                      # V4 raw max = 50K * 1.8 = 90K; cap matches. Lower if
                                      # exit slippage degrades on large thin-book positions.

# Slippage model — recalibrated 2026-04-17 from 36 live trades.
# Era 1 (Mar 30-Apr 2, pre-smart-pricing): fills at ask → full spread cost.
# Era 2 (Apr 13-16, smart pricing active): fills at 30-50% into spread.
# With smart entry limits + 100bps spread gate, actual costs are:
#   Entry: ~25-35bps (30-50% of a <100bps spread), model at 30bps
#   Exit: ~5bps (fills at bid consistently), model at 10bps conservatively
# Round-trip: ~35-40bps actual, modeled at 40bps.
slippage:
  entry_pct: 0.003          # 30bps — matches Era 2 smart-pricing fill at ~35% into spread
  exit_pct: 0.001           # 10bps — exits fill at bid; 10bps buffer for slippage on stops
  # Phase 2a: per-symbol min-cents floor on slippage. Live's smart limits use
  # a $0.03 (3¢) fixed offset that dominates the % component on cheap stocks
  # — a $5 stock at 30bps = 1.5¢, but live actually pays 3¢. Modeling the
  # floor closes a structural BT/LIVE divergence on $5-$15 fills.
  entry_min_cents: 0.03     # min entry slippage = max(entry_pct * price, $0.03)
  exit_min_cents: 0.03      # min exit slippage = max(exit_pct * price, $0.03)

# Risk management
risk:
  hard_stop_pct: 0.02       # 2% hard stop loss per trade (crash protection)
  trail_stop_pct: 0.003     # 0.3% trail below highest high (profit protection)
                             # Validated: 48% WR, +$260K, 13/15 green months
                             # Without trail: 30% WR, lottery-dependent
  trail_arm_pct: 0.003      # CORD 5/8 fix: trail arms only after high crosses
                             # entry × (1+arm_pct). Default = trail_stop_pct so
                             # trail can NEVER fire at a loss. Without this gate
                             # CORD 5/8: entry $5.19, first bid $5.12 → instant
                             # flash trail trigger before bracket cancels
                             # propagated → naked position.
  daily_loss_limit: -5000
